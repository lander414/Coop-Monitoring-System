<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title description">
  <title id="title">Poultry Coop Monitoring System Flowchart</title>
  <desc id="description">Flowchart showing telemetry from sensors and the mock simulator through Supabase, the Node.js Express API, the React dashboard, Gemini AI image analysis, and the final risk assessment.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#0369a1"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#475569"/>
    </marker>
    <style>
      .title { font: 700 34px Georgia, serif; fill: #ffffff; }
      .subtitle { font: 400 16px Arial, sans-serif; fill: #dbeafe; }
      .section { font: 700 16px Arial, sans-serif; fill: #334155; letter-spacing: 1px; }
      .node-title { font: 700 18px Arial, sans-serif; fill: #0f172a; }
      .node-text { font: 400 14px Arial, sans-serif; fill: #475569; }
      .small { font: 600 13px Arial, sans-serif; fill: #475569; }
      .arrow { fill: none; stroke: #475569; stroke-width: 3; marker-end: url(#arrow); }
      .dashed { fill: none; stroke: #64748b; stroke-width: 2.5; stroke-dasharray: 8 7; marker-end: url(#arrow); }
      .node { filter: url(#shadow); stroke-width: 2; }
    </style>
  </defs>

  <rect width="1600" height="1120" fill="url(#background)"/>
  <rect x="0" y="0" width="1600" height="142" fill="url(#header)"/>
  <text x="80" y="65" class="title">Poultry Coop Monitoring System</text>
  <text x="80" y="101" class="subtitle">System flowchart: telemetry collection, storage, AI analysis, and dashboard reporting</text>

  <text x="80" y="190" class="section">1. DATA SOURCES</text>
  <text x="540" y="190" class="section">2. PROCESSING AND STORAGE</text>
  <text x="1040" y="190" class="section">3. USER EXPERIENCE</text>

  <!-- Source nodes -->
  <rect class="node" x="80" y="230" width="300" height="120" rx="14" fill="#ffffff" stroke="#0f766e"/>
  <circle cx="120" cy="270" r="22" fill="#ccfbf1"/>
  <path d="M108 270h24M120 258v24" stroke="#0f766e" stroke-width="3"/>
  <text x="160" y="269" class="node-title">ESP32 / Sensors</text>
  <text x="160" y="296" class="node-text">Temperature, humidity,</text>
  <text x="160" y="318" class="node-text">and chicken presence</text>

  <rect class="node" x="80" y="410" width="300" height="120" rx="14" fill="#ffffff" stroke="#0f766e"/>
  <circle cx="120" cy="450" r="22" fill="#ccfbf1"/>
  <path d="M108 454c8-16 16 16 24 0M108 465h24" fill="none" stroke="#0f766e" stroke-width="3"/>
  <text x="160" y="449" class="node-title">Mock Simulator</text>
  <text x="160" y="476" class="node-text">Generates readings every</text>
  <text x="160" y="498" class="node-text">five seconds for testing</text>

  <!-- Processing nodes -->
  <rect class="node" x="500" y="230" width="330" height="120" rx="14" fill="#ffffff" stroke="#0284c7"/>
  <circle cx="540" cy="270" r="22" fill="#e0f2fe"/>
  <path d="M528 270h24M540 258v24" stroke="#0284c7" stroke-width="3"/>
  <text x="580" y="269" class="node-title">Node.js + Express API</text>
  <text x="580" y="296" class="node-text">Receives telemetry and</text>
  <text x="580" y="318" class="node-text">handles image uploads</text>

  <rect class="node" x="500" y="410" width="330" height="120" rx="14" fill="#ffffff" stroke="#0284c7"/>
  <circle cx="540" cy="450" r="22" fill="#e0f2fe"/>
  <path d="M526 446h28M526 454h28M532 462h16" stroke="#0284c7" stroke-width="3"/>
  <text x="580" y="449" class="node-title">Heat Index + Risk Engine</text>
  <text x="580" y="476" class="node-text">Calculates environment risk</text>
  <text x="580" y="498" class="node-text">from temperature and humidity</text>

  <rect class="node" x="500" y="590" width="330" height="120" rx="14" fill="#ffffff" stroke="#0284c7"/>
  <circle cx="540" cy="630" r="22" fill="#e0f2fe"/>
  <path d="M528 638l8-16 8 10 8-14" fill="none" stroke="#0284c7" stroke-width="3"/>
  <text x="580" y="629" class="node-title">Supabase Database</text>
  <text x="580" y="656" class="node-text">telemetry_logs table stores</text>
  <text x="580" y="678" class="node-text">latest and historical readings</text>

  <rect class="node" x="500" y="770" width="330" height="120" rx="14" fill="#ffffff" stroke="#0284c7"/>
  <circle cx="540" cy="810" r="22" fill="#e0f2fe"/>
  <path d="M528 816c2-10 5-16 12-16s10 6 12 16M530 818h20" fill="none" stroke="#0284c7" stroke-width="3"/>
  <text x="580" y="809" class="node-title">Gemini AI Service</text>
  <text x="580" y="836" class="node-text">Analyzes chicken images for</text>
  <text x="580" y="858" class="node-text">visible heat-stress indicators</text>

  <!-- UX nodes -->
  <rect class="node" x="1040" y="230" width="400" height="140" rx="14" fill="#ffffff" stroke="#d97706"/>
  <circle cx="1084" cy="280" r="22" fill="#fef3c7"/>
  <path d="M1073 273h22v17h-22zM1077 268h14" fill="none" stroke="#d97706" stroke-width="3"/>
  <text x="1125" y="279" class="node-title">React + TypeScript Dashboard</text>
  <text x="1125" y="306" class="node-text">Polls latest and historical</text>
  <text x="1125" y="328" class="node-text">telemetry every five seconds</text>
  <text x="1125" y="350" class="node-text">Displays charts, status, and alerts</text>

  <rect class="node" x="1040" y="470" width="400" height="140" rx="14" fill="#ffffff" stroke="#d97706"/>
  <circle cx="1084" cy="520" r="22" fill="#fef3c7"/>
  <path d="M1072 512h24v17h-24zM1076 516h16M1076 522h11" fill="none" stroke="#d97706" stroke-width="3"/>
  <text x="1125" y="519" class="node-title">User Uploads Chicken Image</text>
  <text x="1125" y="546" class="node-text">Dashboard sends image plus</text>
  <text x="1125" y="568" class="node-text">current sensor values to API</text>
  <text x="1125" y="590" class="node-text">using POST /api/evaluate-risk</text>

  <rect class="node" x="1040" y="710" width="400" height="140" rx="14" fill="#ffffff" stroke="#b91c1c"/>
  <circle cx="1084" cy="760" r="22" fill="#fee2e2"/>
  <path d="M1084 748v15M1084 769v2" stroke="#b91c1c" stroke-width="4" stroke-linecap="round"/>
  <path d="M1084 743l15 27h-30z" fill="none" stroke="#b91c1c" stroke-width="2"/>
  <text x="1125" y="759" class="node-title">Final Assessment</text>
  <text x="1125" y="786" class="node-text">Combines environment risk,</text>
  <text x="1125" y="808" class="node-text">AI risk, and motion level</text>
  <text x="1125" y="830" class="node-text">Returns risk and RGB command</text>

  <!-- Arrows and labels -->
  <path class="arrow" d="M380 290 C430 290 440 290 500 290"/>
  <text x="408" y="276" class="small">telemetry</text>
  <path class="arrow" d="M380 470 C430 470 440 470 500 470"/>
  <text x="407" y="456" class="small">mock data</text>
  <path class="arrow" d="M665 350 L665 410"/>
  <text x="680" y="384" class="small">calculate</text>
  <path class="arrow" d="M665 530 L665 590"/>
  <text x="680" y="564" class="small">store</text>
  <path class="arrow" d="M830 650 C920 650 950 300 1040 300"/>
  <text x="875" y="466" class="small">GET latest/history</text>
  <path class="arrow" d="M1240 370 L1240 470"/>
  <text x="1255" y="427" class="small">upload</text>
  <path class="arrow" d="M1040 540 C930 540 930 830 830 830"/>
  <text x="885" y="674" class="small">image + sensors</text>
  <path class="arrow" d="M830 830 C920 830 950 780 1040 780"/>
  <text x="871" y="814" class="small">AI result</text>
  <path class="arrow" d="M1240 610 L1240 710"/>
  <text x="1255" y="667" class="small">evaluate</text>
  <path class="dashed" d="M1040 850 C920 940 760 950 665 890"/>
  <text x="835" y="956" class="small">risk response</text>

  <!-- Legend -->
  <rect x="80" y="970" width="1360" height="90" rx="14" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="110" y="1008" class="section">LEGEND</text>
  <line x1="250" y1="1004" x2="325" y2="1004" class="arrow"/>
  <text x="345" y="1010" class="node-text">Data or request flow</text>
  <line x1="590" y1="1004" x2="665" y2="1004" class="dashed"/>
  <text x="685" y="1010" class="node-text">Returned result or feedback</text>
  <rect x="970" y="987" width="20" height="20" rx="4" fill="#ccfbf1" stroke="#0f766e"/>
  <text x="1005" y="1010" class="node-text">Input source</text>
  <rect x="1170" y="987" width="20" height="20" rx="4" fill="#fef3c7" stroke="#d97706"/>
  <text x="1205" y="1010" class="node-text">Frontend interaction</text>
</svg>
